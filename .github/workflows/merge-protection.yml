name: Merge Protection

on:
  workflow_call:
    inputs:
      allowed_branches:
        required: true
        type: string

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validation
        run: |
          echo "validate ${{ github.head_ref }}..."
          echo ${{ inputs.allowed_branches }}
          branches = ${{ inputs.allowed_branches }}
          echo $branches
          for branch in $branches[@]
          do
            echo $branch
            if echo "${{ github.head_ref }}" | grep ^$branch.*
            then
              echo "valid branch" && exit 0
            fi
          done
          echo "invalid branch" 
          echo "pull request only allowed from branches ${{ inputs.allowed_branches }}" && exit 1