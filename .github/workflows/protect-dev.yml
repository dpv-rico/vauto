name: Dev Branch Protection

on:
  push:
    branches: dev
env:
  dev_branch: "dev"
  input_branches: ( "feat/" "fix/" "release/" )
  test_ref: "feat/feat8"

jobs:
  checking:
    runs-on: ubuntu-latest
    steps:
      - name: is valid branch
        run: |
          echo "checking ${{ github.head_ref }}"
          for branch in ${input_branches[@]}
          do
            echo "$branch"
            if echo "${{ env.test_ref }}" | grep -q $branch
            then
              echo "valid branch" && exit 0
            fi
          done
          echo "merge allowed only from ${input_branches}" && exit 1
          
