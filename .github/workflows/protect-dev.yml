name: Dev Branch Protection

on:
  pull_request:
    branches: dev
env:
  dev_branch: "dev"
  input_branches: ("feat/" "fix/" "release/")
  input_branches_a: '["feat/", "fix/", "release/"]'

jobs:
  checking:
    runs-on: ubuntu-latest
    steps:
      - name: is valid branch
        run: |
          echo ${{ github.head_ref }}
          echo ${{ fromJson(input_branches_a) }}
          for branch in ${input_branches[@]}
          do
            echo ${branch}
            if [[ "${{ github.head_ref }}" == ${branch}* ]]
            then
              echo "valid branch" && exit 0
            fi
          done
          echo "merge allowed only from ${input_branches}" && exit 1
          
