name: Dev Branch Protection

on:
  pull_request:
    branches: dev
env:
  dev_branch: "dev"
  input_branches: '["feat/", "fix/", "release/"]'
  input_branches2: ("feat/" "fix/" "release/")

jobs:
  checking:
    runs-on: ubuntu-latest
    steps:
      - name: is valid branch
        run: |
          for branch in ${{env.input_branches2[@]}}
          do
            if [[ github.head_ref == $branch* ]]
            then
              echo "valid branch" && exit 0
            fi
          done
          exit 1
          
